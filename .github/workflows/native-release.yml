name: Native release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified main commit as a stable release
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: native-release-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: 3
  PYTHONUTF8: "1"
jobs:
  linux-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require green Linux CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          for attempt in range(90):
              runs = json.loads(subprocess.check_output(["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/ci.yml/runs?head_sha=" + os.environ["GITHUB_SHA"]]))["workflow_runs"]
              if runs and runs[0]["status"] == "completed":
                  assert runs[0]["conclusion"] == "success", "Linux CI must pass before native packaging"
                  print("Linux CI passed:", runs[0]["html_url"])
                  break
              time.sleep(20)
          else:
              raise SystemExit("Linux CI gate timed out")
          PY
  build:
    needs: linux-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop and test dependencies
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 pipewire-bin ffmpeg xvfb dbus-x11 desktop-file-utils xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
          components: clippy
      - name: Match sherpa-onnx's static Windows CRT
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-native
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/omascribe/downloads
          key: offline-asr-${{ hashFiles('models.lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Generate platform icons
        run: npx tauri icon src/assets/icon.svg
      - uses: actions/cache/restore@v4
        id: sherpa-cache
        with:
          path: build-assets/native-asr
          key: sherpa-native-sdk-${{ matrix.target }}-${{ hashFiles('models.lock.json') }}
      - name: Restore verified ASR libraries outside Cargo cache
        run: python scripts/native-libraries.py --target ${{ matrix.target }}
      - uses: actions/cache/save@v4
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        with:
          path: build-assets/native-asr
          key: ${{ steps.sherpa-cache.outputs.cache-primary-key }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: build-assets/native/models
          key: native-models-${{ hashFiles('models.lock.json') }}
      - name: Download and verify offline models
        env:
          OMASCRIBE_MODELS_DIR: ${{ github.workspace }}/build-assets/native/models
        run: python scripts/setup.py --models-only
      - uses: actions/cache/save@v4
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: build-assets/native/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: llama-cache
        with:
          path: build-assets/native/runtime/llama
          key: native-llama-${{ matrix.target }}-${{ hashFiles('models.lock.json', 'scripts/native-package.py') }}-native-v2
      - name: Prepare verified models and native inference runtime
        run: python scripts/native-package.py --target ${{ matrix.target }}
      - uses: actions/cache/save@v4
        if: always() && steps.llama-cache.outputs.cache-hit != 'true' && hashFiles('build-assets/native/runtime/llama/llama-server*') != ''
        with:
          path: build-assets/native/runtime/llama
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}
      - name: Build native installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Verify installed assets and offline inference
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- python scripts/native-smoke.py --target ${{ matrix.target }}
          else
            python scripts/native-smoke.py --target ${{ matrix.target }}
          fi
      - name: Build and test the smaller update with reused models
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- python scripts/native-runtime-update.py --target ${{ matrix.target }}
          else
            python scripts/native-runtime-update.py --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.target }}
          path: |
            ci-results/
            !ci-results/**/model-store/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets
      - name: Create signed update manifest
        run: python scripts/update-manifest.py
      - name: Publish all five tested installers as a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          VERSION=$(node -p 'require("./package.json").version')
          test "$(find release-assets -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -name '*.exe' ! -name '*-runtime*' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' ! -name '*-runtime*' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          cd release-assets
          cat ./*.sha256 | tr -d '\r' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          python scripts/release-notes.py --version "$VERSION" --output release-body.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --title "OmaScribe $VERSION" --notes-file release-body.md
          gh release create "v$VERSION-updates" --target "$GITHUB_SHA" --draft --title "OmaScribe $VERSION — automatic update files" --notes "Application-managed update payloads. For normal installation, use https://omascribe.eazylee.si/download/."
          gh release upload "v$VERSION-updates" release-assets/*-runtime.app.tar.gz release-assets/*-runtime.exe release-assets/*-runtime.AppImage
          gh release edit "v$VERSION-updates" --draft=false --prerelease=false --latest=false
          gh release upload "v$VERSION" release-assets/*.dmg release-assets/*.deb release-assets/*_Windows-x64.exe release-assets/*_Linux-x64.AppImage release-assets/*_macOS-AppleSilicon.app.tar.gz release-assets/*_macOS-Intel.app.tar.gz release-assets/latest.json release-assets/latest-runtime.json release-assets/SHA256SUMS.txt
          gh release edit "v$VERSION" --draft=false --prerelease=false --latest
