name: Website validation
on:
  pull_request:
    paths:
      - 'landing/**'
      - 'community/**'
      - 'model-catalog.json'
      - 'docs/benchmarks/**'
      - '.github/workflows/site*.yml'
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'community/**'
      - 'model-catalog.json'
      - 'docs/benchmarks/**'
      - '.github/workflows/site*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: landing
      - run: npm run check
        working-directory: landing
