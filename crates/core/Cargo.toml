[package]
name = "omascribe-core"
version = "0.3.5"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
fs2 = "0.4"
rubato = "0.16"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4", "serde"] }
jieba-rs = { version = "0.11.0", features = ["tfidf"] }
minisign-verify = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "=0.16.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
