[package]
name = "omascribe"
version = "0.3.4"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
base64 = "0.22"
omascribe-core = { path = "../crates/core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# deep-link 2.6.2 initializes ParseOption explicitly; rust-ini 0.21.3 added fields.
rust-ini = "=0.21.1"
gtk = "0.18"
libloading = "0.8"
webkit2gtk = {version="2", optional=true}
cairo-rs = {version="0.18", features=["png"], optional=true}

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
ui-test = ["dep:webkit2gtk", "dep:cairo-rs"]
